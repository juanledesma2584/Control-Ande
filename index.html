<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Luz ANDE</title>

    <!-- ÍCONO VECTORIAL DE ENERGÍA / CONTROL ELÉCTRICO PARA PANTALLA DE INICIO -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/2983/2983780.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2983/2983780.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        andeBlue: {
                            500: '#00529b',
                            600: '#003e75',
                        },
                        electricYellow: '#ffb703'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 pb-20">

    <!-- ENCABEZADO CON LOGO VECTORIAL -->
    <header class="w-full max-w-md mb-6 bg-slate-800 p-5 rounded-3xl border border-slate-700 shadow-2xl flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-amber-400 flex items-center justify-center text-2xl shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">Control ANDE</h1>
                <p class="text-xs text-slate-400">Sistema de Iluminación & Relés</p>
            </div>
        </div>
        <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
    </header>

    <!-- PANEL DE CONTROL PRINCIPAL -->
    <main class="w-full max-w-md bg-slate-800/80 p-6 rounded-3xl border border-slate-700/80 shadow-2xl space-y-5 backdrop-blur-sm">
        <div class="flex justify-between items-center pb-3 border-b border-slate-700/60">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Estado de Conmutación</h2>
            <span class="text-xs font-semibold text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">Línea Activa</span>
        </div>

        <!-- TARJETA DE INTERRUPTOR DE LUZ -->
        <div class="p-5 bg-slate-950 rounded-2xl border border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-slate-900 text-amber-400 flex items-center justify-center text-lg border border-slate-800">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-white">Carga Principal</h3>
                    <p class="text-xs text-slate-500">Relé canal 1</p>
                </div>
            </div>
            <button onclick="toggleRelay(this)" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow-lg transition-all">
                ENCENDIDO
            </button>
        </div>
    </main>

    <script>
        function toggleRelay(btn) {
            if (btn.classList.contains('bg-blue-600')) {
                btn.className = "px-5 py-2.5 bg-slate-800 text-slate-400 rounded-xl text-xs font-bold border border-slate-700 transition-all";
                btn.textContent = "APAGADO";
            } else {
                btn.className = "px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow-lg transition-all";
                btn.textContent = "ENCENDIDO";
            }
        }
    </script>
</body>
</html>
