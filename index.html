<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control ANDE v7 Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; padding: 15px; background: #f1f5f9; color: #333; }
        .header-container { text-align: center; margin-bottom: 20px; }
        h1 { color: #1e293b; font-size: 1.5rem; margin: 5px 0; }
        .panel-global { background: #3b82f6; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .summary-item { background: rgba(255,255,255,0.2); padding: 8px; border-radius: 8px; text-align: center; font-size: 0.9rem; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: #64748b; margin-top: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 8px; margin-top: 2px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .total { background: #10b981; color: white; font-weight: 800; padding: 10px; border-radius: 8px; text-align: center; margin: 15px 0; }
        button { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; color: white; }
        .btn-wpp { background: #25D366; }
        .btn-pdf { background: #ef4444; }
    </style>
</head>
<body>

    <div class="header-container"><h1>Control ANDE v7</h1></div>

    <div class="panel-global">
        <label style="color:white">Tarifa Global (Gs/kWh):</label>
        <input type="number" id="tarifaGlobal" value="450" oninput="actualizarTarifaGlobal()">
        <button onclick="limpiarTodo()" style="background:#e11d48; margin-top:10px;">🧹 Limpiar Mes (Nuevo Mes)</button>
        <div class="summary-box">
            <div class="summary-item">Alquileres: <br><span id="totalAlquiler">0</span></div>
            <div class="summary-item">Energía: <br><span id="totalEnergia">0</span></div>
        </div>
        <div style="text-align:center; margin-top:10px; font-size:1.2rem; font-weight:bold;">Total General: <span id="totalGeneral">0</span> Gs</div>
    </div>

    <div id="contenedor"></div>

    <script>
        let db;
        const request = indexedDB.open("ControlAndE_DB", 1);
        request.onupgradeneeded = (e) => { db = e.target.result; db.createObjectStore("departamentos", { keyPath: "id" }); };
        request.onsuccess = (e) => { db = e.target.result; cargarDatosDB(); };

        function hacerTarjetas() {
            let html = '';
            for(let i=1; i<=4; i++) {
                html += `
                <div class="card">
                    <h3>Depto ${i}</h3>
                    <input type="text" id="nom${i}" placeholder="Inquilino" oninput="guardar(${i})">
                    <div style="display:flex; gap:5px">
                        <div style="flex:1"><label>Ant:</label><input type="date" id="fecAnt${i}" oninput="guardar(${i})"></div>
                        <div style="flex:1"><label>Act:</label><input type="date" id="fecAct${i}" oninput="guardar(${i})"></div>
                    </div>
                    <input type="number" id="alq${i}" placeholder="Alquiler (Gs.)" oninput="calc(${i})">
                    <input type="number" id="ini${i}" placeholder="Lectura Inicial" oninput="calc(${i})">
                    <input type="number" id="fin${i}" placeholder="Lectura Final" oninput="calc(${i})">
                    <input type="hidden" id="tar${i}" value="450">
                    <input type="number" id="tel${i}" placeholder="WhatsApp (595981...)" oninput="guardar(${i})">
                    <div class="total" id="res${i}">0 Gs</div>
                    <button class="btn-pdf" onclick="generarPDF(${i})">📄 Generar Recibo PDF</button>
                    <button class="btn-wpp" onclick="enviarWpp(${i})">📲 WhatsApp Detallado</button>
                </div>`;
            }
            document.getElementById('contenedor').innerHTML = html;
        }
        hacerTarjetas();

        function actualizarTarifaGlobal() {
            let t = document.getElementById('tarifaGlobal').value;
            for(let i=1; i<=4; i++) {
                document.getElementById('tar'+i).value = t;
                calc(i);
            }
        }

        function limpiarTodo() {
            if(confirm("¿Limpiar lecturas para un mes nuevo?")) {
                for(let i=1; i<=4; i++) {
                    document.getElementById('ini'+i).value = document.getElementById('fin'+i).value;
                    document.getElementById('fin'+i).value = '';
                    document.getElementById('fecAnt'+i).value = document.getElementById('fecAct'+i).value;
                    document.getElementById('fecAct'+i).value = '';
                    calc(i);
                }
            }
        }

        function calc(id) {
            let alq = parseFloat(document.getElementById('alq'+id).value) || 0;
            let ini = parseFloat(document.getElementById('ini'+id).value) || 0;
            let fin = parseFloat(document.getElementById('fin'+id).value) || 0;
            let tar = parseFloat(document.getElementById('tar'+id).value) || 450;
            let kwh = (fin > ini) ? (fin - ini) : 0;
            let costo = kwh * tar;
            document.getElementById('res'+id).innerText = (alq + costo).toLocaleString('es-PY') + " Gs";
            guardar(id);
            sumarTodo();
        }

        function sumarTodo() {
            let tAlq = 0, tEnergia = 0;
            for(let i=1; i<=4; i++) {
                tAlq += parseFloat(document.getElementById('alq'+i).value) || 0;
                let ini = parseFloat(document.getElementById('ini'+i).value) || 0;
                let fin = parseFloat(document.getElementById('fin'+i).value) || 0;
                let tar = parseFloat(document.getElementById('tar'+i).value) || 450;
                tEnergia += (fin > ini ? (fin-ini)*tar : 0);
            }
            document.getElementById('totalAlquiler').innerText = tAlq.toLocaleString('es-PY');
            document.getElementById('totalEnergia').innerText = tEnergia.toLocaleString('es-PY');
            document.getElementById('totalGeneral').innerText = (tAlq + tEnergia).toLocaleString('es-PY');
        }

        function generarPDF(id) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let nom = document.getElementById('nom'+id).value;
            let alq = parseInt(document.getElementById('alq'+id).value) || 0;
            let ini = parseInt(document.getElementById('ini'+id).value) || 0;
            let fin = parseInt(document.getElementById('fin'+id).value) || 0;
            let tar = parseInt(document.getElementById('tar'+id).value) || 450;
            let kwh = (fin - ini);
            let costo = kwh * tar;
            let total = alq + costo;

            doc.setDrawColor(59, 130, 246);
            doc.rect(5, 5, 200, 287); // Borde de página
            doc.setFontSize(22);
            doc.text("RECIBO DE PAGO", 105, 20, {align: "center"});
            doc.setFontSize(12);
            doc.text("Inquilino: " + nom, 20, 40);
            doc.text("Fecha: " + new Date().toLocaleDateString(), 150, 40);
            doc.line(20, 45, 190, 45);
            doc.text("Concepto", 20, 55); doc.text("Monto (Gs.)", 150, 55);
            doc.text("Alquiler:", 20, 65); doc.text(alq.toLocaleString('es-PY'), 150, 65);
            doc.text("Consumo Energía ("+kwh+" kWh):", 20, 75); doc.text(costo.toLocaleString('es-PY'), 150, 75);
            doc.line(20, 85, 190, 85);
            doc.setFontSize(16);
            doc.text("TOTAL A PAGAR: " + total.toLocaleString('es-PY') + " Gs", 20, 100);
            doc.save("Recibo_"+nom+".pdf");
        }

        function enviarWpp(id) {
            let nom = document.getElementById('nom'+id).value;
            let fecAnt = document.getElementById('fecAnt'+id).value;
            let fecAct = document.getElementById('fecAct'+id).value;
            let alq = parseFloat(document.getElementById('alq'+id).value) || 0;
            let ini = parseFloat(document.getElementById('ini'+id).value) || 0;
            let fin = parseFloat(document.getElementById('fin'+id).value) || 0;
            let tar = parseFloat(document.getElementById('tar'+id).value) || 450;
            let tel = document.getElementById('tel'+id).value;
            let kwh = fin - ini;
            let costo = kwh * tar;
            let total = alq + costo;

            let msg = `Hola ${nom}! Te envío el detalle del pago.\n` +
                      `📅 *Periodo:* ${fecAnt} al ${fecAct}\n\n` +
                      `🏠 *Alquiler:* ${alq.toLocaleString('es-PY')} Gs.\n` +
                      `⚡ *Consumo de Luz:* ${kwh} kWh\n` +
                      `   _(Lectura Inicial: ${ini} - Final: ${fin})_\n` +
                      `💰 *Costo Energía:* ${costo.toLocaleString('es-PY')} Gs. (${tar} Gs/kWh)\n\n` +
                      `📌 *TOTAL A PAGAR:* *${total.toLocaleString('es-PY')} Gs.*\n\n` +
                      `Por favor, me confirmás el pago. ¡Gracias!`;
            
            window.open("https://wa.me/" + tel + "?text=" + encodeURIComponent(msg));
        }

        function guardar(id) {
            if(!db) return;
            const tx = db.transaction("departamentos", "readwrite");
            const store = tx.objectStore("departamentos");
            store.put({
                id: id, nom: document.getElementById('nom'+id).value, fecAnt: document.getElementById('fecAnt'+id).value,
                fecAct: document.getElementById('fecAct'+id).value, alq: document.getElementById('alq'+id).value,
                ini: document.getElementById('ini'+id).value, fin: document.getElementById('fin'+id).value,
                tar: document.getElementById('tar'+id).value, tel: document.getElementById('tel'+id).value
            });
        }

        function cargarDatosDB() {
            const tx = db.transaction("departamentos", "readonly");
            const store = tx.objectStore("departamentos");
            for(let i=1; i<=4; i++) {
                const req = store.get(i);
                req.onsuccess = (e) => {
                    const d = e.target.result;
                    if(d) {
                        document.getElementById('nom'+i).value = d.nom || '';
                        document.getElementById('fecAnt'+i).value = d.fecAnt || '';
                        document.getElementById('fecAct'+i).value = d.fecAct || '';
                        document.getElementById('alq'+i).value = d.alq || '';
                        document.getElementById('ini'+i).value = d.ini || '';
                        document.getElementById('fin'+i).value = d.fin || '';
                        document.getElementById('tar'+i).value = d.tar || 450;
                        document.getElementById('tel'+i).value = d.tel || '';
                        document.getElementById('tarifaGlobal').value = d.tar || 450;
                        calc(i);
                    }
                };
            }
        }
    </script>
</body>
</html>
