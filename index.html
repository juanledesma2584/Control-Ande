<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control ANDE</title>

    <!-- Configuración PWA y Manifest para la pantalla de inicio -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    <meta name="theme-color" content="#2b5876">

    <style>
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --accent-color: #00d2ff;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
        }

        /* LOGO VISIBLE EN LA PANTALLA PRINCIPAL DE LA APP */
        .app-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid var(--primary-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        /* Pestañas de Departamentos (1 al 4) */
        .dept-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }

        .dept-btn {
            flex: 1;
            padding: 10px 5px;
            background: #e0e0e0;
            color: #555;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dept-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .tariff-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .tariff-box input {
            flex: 1;
        }

        .btn-edit-tariff {
            padding: 10px 15px;
            background: #ffc107;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button.action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-calc {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-save {
            background-color: #28a745;
            color: white;
        }

        /* BOTÓN DE WHATSAPP */
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: none; /* Se muestra solo al calcular */
            box-shadow: 0 3px 8px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background-color: #1ebe57;
        }

        .btn-reset {
            background-color: #dc3545;
            color: white;
        }

        .results-panel {
            margin-top: 20px;
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
        }

        .results-panel h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .result-row.total {
            font-weight: bold;
            font-size: 1.1rem;
            border-top: 1px solid #ccc;
            padding-top: 8px;
            color: var(--secondary-color);
        }

        .history-section {
            margin-top: 25px;
        }

        .history-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: #fff;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <!-- LOGO VISIBLE EN LA PANTALLA PRINCIPAL -->
        <img src="favicon.ico" alt="Logo Control ANDE" class="app-logo" onerror="this.style.display='none'">
        <h1>Control ANDE</h1>
        <p style="font-size: 0.8rem; color: #666;">Alquiler y Energía por Departamento</p>
    </header>

    <!-- Pestañas de Departamentos (1 al 4) -->
    <div class="dept-tabs">
        <button class="dept-btn active" onclick="selectDept(1)">Dpto 1</button>
        <button class="dept-btn" onclick="selectDept(2)">Dpto 2</button>
        <button class="dept-btn" onclick="selectDept(3)">Dpto 3</button>
        <button class="dept-btn" onclick="selectDept(4)">Dpto 4</button>
    </div>

    <form id="calcForm">
        <div class="form-group">
            <label for="tenant">Inquilino / Nombre:</label>
            <input type="text" id="tenant" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="form-group">
            <label for="tenantPhone">Nro. WhatsApp (Ej: 0981123456):</label>
            <input type="tel" id="tenantPhone" placeholder="Ej: 595981123456" required>
        </div>

        <div class="form-group">
            <label for="rentAmount">Monto Alquiler Base (Gs.):</label>
            <input type="number" id="rentAmount" placeholder="Ej: 1500000" required>
        </div>

        <div class="form-group">
            <label for="prevReading">Lectura Anterior (kWh):</label>
            <input type="number" id="prevReading" step="0.1" placeholder="Ej: 12450.5" required>
        </div>

        <div class="form-group">
            <label for="currReading">Lectura Actual (kWh):</label>
            <input type="number" id="currReading" step="0.1" placeholder="Ej: 12680.0" required>
        </div>

        <div class="form-group">
            <label for="costPerKwh">Costo kWh ANDE (Modificable):</label>
            <div class="tariff-box">
                <input type="number" id="costPerKwh" value="440" disabled>
                <button type="button" class="btn-edit-tariff" onclick="toggleTariffEdit()" id="editTariffBtn">Editar</button>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="action-btn btn-calc" onclick="calculate()">Calcular</button>
            <button type="button" class="action-btn btn-save" onclick="saveRecord()">Guardar</button>
        </div>
    </form>

    <div class="results-panel" id="resultsPanel">
        <h3>Resumen - <span id="currentDeptTitle">Departamento 1</span></h3>
        <div class="result-row">
            <span>Consumo Total:</span>
            <span id="resKwh">0 kWh</span>
        </div>
        <div class="result-row">
            <span>Monto Energía:</span>
            <span id="resEnergyCost">0 Gs.</span>
        </div>
        <div class="result-row">
            <span>Monto Alquiler:</span>
            <span id="resRent">0 Gs.</span>
        </div>
        <div class="result-row total">
            <span>Total a Pagar:</span>
            <span id="resTotal">0 Gs.</span>
        </div>

        <!-- BOTÓN DE WHATSAPP INTEGRADO -->
        <button type="button" class="btn-whatsapp" id="whatsappBtn" onclick="sendWhatsApp()">💬 Enviar Extracto por WhatsApp</button>
    </div>

    <div class="history-section">
        <h3>Historial Guardado (<span id="histDeptTitle">Dpto 1</span>)</h3>
        <ul class="history-list" id="historyList"></ul>
        <div class="btn-group" style="margin-top: 10px;">
            <button type="button" class="action-btn btn-reset" onclick="clearHistory()">Borrar Historial Dpto</button>
        </div>
    </div>
</div>

<script>
    let activeDept = 1;
    let currentCalculation = null;

    function selectDept(deptNum) {
        activeDept = deptNum;
        
        const buttons = document.querySelectorAll('.dept-btn');
        buttons.forEach((btn, idx) => {
            if (idx + 1 === deptNum) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        document.getElementById('currentDeptTitle').textContent = `Departamento ${deptNum}`;
        document.getElementById('histDeptTitle').textContent = `Dpto ${deptNum}`;

        loadDeptData();
        renderHistory();
    }

    function toggleTariffEdit() {
        const input = document.getElementById('costPerKwh');
        const btn = document.getElementById('editTariffBtn');
        if (input.disabled) {
            input.disabled = false;
            input.focus();
            btn.textContent = 'Bloquear';
            btn.style.background = '#28a745';
            btn.style.color = '#fff';
        } else {
            input.disabled = true;
            btn.textContent = 'Editar';
            btn.style.background = '#ffc107';
            btn.style.color = '#333';
            localStorage.setItem('ande_tariff_kwh', input.value);
        }
    }

    function calculate() {
        const tenant = document.getElementById('tenant').value || 'Inquilino';
        const phone = document.getElementById('tenantPhone').value || '';
        const rent = parseFloat(document.getElementById('rentAmount').value) || 0;
        const prev = parseFloat(document.getElementById('prevReading').value) || 0;
        const curr = parseFloat(document.getElementById('currReading').value) || 0;
        const costKwh = parseFloat(document.getElementById('costPerKwh').value) || 440;

        if (curr < prev) {
            alert('La lectura actual no puede ser menor a la lectura anterior.');
            return;
        }

        const kwhUsed = curr - prev;
        const energyTotal = kwhUsed * costKwh;
        const grandTotal = rent + energyTotal;

        document.getElementById('resKwh').textContent = kwhUsed.toFixed(1) + ' kWh';
        document.getElementById('resEnergyCost').textContent = energyTotal.toLocaleString('es-PY') + ' Gs.';
        document.getElementById('resRent').textContent = rent.toLocaleString('es-PY') + ' Gs.';
        document.getElementById('resTotal').textContent = grandTotal.toLocaleString('es-PY') + ' Gs.';

        document.getElementById('whatsappBtn').style.display = 'block';

        currentCalculation = {
            dept: activeDept,
            date: new Date().toLocaleDateString('es-PY'),
            tenant,
            phone,
            rent,
            prev,
            curr,
            costKwh,
            kwhUsed: kwhUsed.toFixed(1),
            energyTotal,
            grandTotal
        };
    }

    function sendWhatsApp() {
        if (!currentCalculation) return;
        
        let phone = currentCalculation.phone.trim();
        if (phone.startsWith('0')) {
            phone = '595' + phone.substring(1);
        }

        // Mensaje actualizado con lectura inicial, final, diferencia y totales
        const message = `Hola *${currentCalculation.tenant}* 👋, aquí está tu extracto del *Departamento ${currentCalculation.dept}*:\n\n` +
                        `📊 *Medidor Electricidad (ANDE):*\n` +
                        `• Lectura Anterior: ${currentCalculation.prev} kWh\n` +
                        `• Lectura Actual: ${currentCalculation.curr} kWh\n` +
                        `• *Consumo Total:* ${currentCalculation.kwhUsed} kWh\n\n` +
                        `💵 *Detalle de Cobro:*\n` +
                        `🏠 Alquiler Base: ${currentCalculation.rent.toLocaleString('es-PY')} Gs.\n` +
                        `⚡ Energía (${currentCalculation.kwhUsed} kWh x ${currentCalculation.costKwh} Gs.): ${currentCalculation.energyTotal.toLocaleString('es-PY')} Gs.\n` +
                        `-----------------------------------\n` +
                        `💰 *TOTAL A PAGAR:* *${currentCalculation.grandTotal.toLocaleString('es-PY')} Gs.*`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;
        window.open(whatsappUrl, '_blank');
    }

    function saveRecord() {
        if (!currentCalculation) {
            alert('Realizá un cálculo antes de guardar.');
            return;
        }

        const key = `ande_control_dept_${activeDept}`;
        let history = JSON.parse(localStorage.getItem(key)) || [];
        history.push(currentCalculation);
        localStorage.setItem(key, JSON.stringify(history));

        localStorage.setItem(`ande_last_state_${activeDept}`, JSON.stringify(currentCalculation));

        renderHistory();
        alert(`Registro del Departamento ${activeDept} guardado con éxito.`);
    }

    function loadDeptData() {
        const savedTariff = localStorage.getItem('ande_tariff_kwh');
        if (savedTariff) {
            document.getElementById('costPerKwh').value = savedTariff;
        }

        const lastState = JSON.parse(localStorage.getItem(`ande_last_state_${activeDept}`));
        if (lastState) {
            document.getElementById('tenant').value = lastState.tenant || '';
            document.getElementById('tenantPhone').value = lastState.phone || '';
            document.getElementById('rentAmount').value = lastState.rent || '';
            document.getElementById('prevReading').value = lastState.curr || ''; 
            document.getElementById('currReading').value = '';
        } else {
            document.getElementById('tenant').value = '';
            document.getElementById('tenantPhone').value = '';
            document.getElementById('rentAmount').value = '';
            document.getElementById('prevReading').value = '';
            document.getElementById('currReading').value = '';
        }
        
        document.getElementById('resKwh').textContent = '0 kWh';
        document.getElementById('resEnergyCost').textContent = '0 Gs.';
        document.getElementById('resRent').textContent = '0 Gs.';
        document.getElementById('resTotal').textContent = '0 Gs.';
        document.getElementById('whatsappBtn').style.display = 'none';
        currentCalculation = null;
    }

    function renderHistory() {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';
        const key = `ande_control_dept_${activeDept}`;
        let history = JSON.parse(localStorage.getItem(key)) || [];

        if (history.length === 0) {
            historyList.innerHTML = '<li style="text-align:center; color:#999; padding:10px;">Sin registros</li>';
            return;
        }

        history.forEach((item) => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `
                <div>
                    <strong>${item.tenant}</strong> (${item.date})<br>
                    Consumo: ${item.kwhUsed} kWh
                </div>
                <div>
                    <strong>${item.grandTotal.toLocaleString('es-PY')} Gs.</strong>
                </div>
            `;
            historyList.appendChild(li);
        });
    }

    function clearHistory() {
        if (confirm(`¿Estás seguro de borrar el historial del Departamento ${activeDept}?`)) {
            localStorage.removeItem(`ande_control_dept_${activeDept}`);
            localStorage.removeItem(`ande_last_state_${activeDept}`);
            loadDeptData();
            renderHistory();
        }
    }

    window.onload = function() {
        selectDept(1);
    };
</script>

</body>
</html>
